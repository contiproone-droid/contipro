{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                 style="width: 3.2rem; height: 3.2rem; background: var(--ink-950); color: var(--signal-amber);">
                <i class="bi bi-diagram-3-fill fs-4"></i>
            </div>
            <h1 class="font-display fs-3 fw-semibold mb-1">Pipeline<span class="accent--ink">CRM</span></h1>
            <p class="text-muted small mb-0">Gestão de perfis &middot; Facebook &amp; WhatsApp Business</p>
        </div>
        <div class="card">
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger py-2 small">Usuário ou senha inválidos.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small">Usuário</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Senha</label>
                        {{ form.password }}
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-brand w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
