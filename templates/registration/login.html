{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <h4 class="mb-3 text-center"><i class="bi bi-diagram-3-fill"></i> CRM de Perfis</h4>
            <p class="text-muted text-center small">Entre para gerenciar os perfis</p>
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="alert alert-danger py-2">Usuário ou senha inválidos.</div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    {{ form.password }}
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
